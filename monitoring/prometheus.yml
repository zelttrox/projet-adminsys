# Configuration Prometheus InfraReady (deployee sur OPS01 dans /etc/prometheus/prometheus.yml)
#
# Les cibles sont declarees par adresse IP et non par nom DNS : le DNS du labo
# est porte par WIN-DC01. Si le controleur tombe, on veut continuer a voir
# LINUX01 et OPS01, et voir WIN-DC01 "hors ligne", pas tout perdre d'un coup.
# Le label "hote" donne un nom lisible a chaque machine dans Grafana.

---
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          hote: ops01

  - job_name: linux
    static_configs:
      - targets: ["192.168.50.30:9100"]
        labels:
          hote: linux01
          role: serveur-web
      - targets: ["192.168.50.20:9100"]
        labels:
          hote: ops01
          role: supervision

  - job_name: windows
    static_configs:
      - targets: ["192.168.50.10:9182"]
        labels:
          hote: win-dc01
          role: controleur-domaine
