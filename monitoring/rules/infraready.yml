# Regles d'alerte InfraReady (deployees dans /etc/prometheus/rules/)
# Visibles dans Prometheus : http://ops01.infraready.test:9090/alerts
---
groups:
  - name: disponibilite
    rules:
      - alert: HoteInjoignable
        expr: up{job=~"linux|windows"} == 0
        for: 1m
        labels:
          severite: critique
        annotations:
          resume: "{{ $labels.hote }} ne repond plus"
          description: "L'exporter de {{ $labels.hote }} ({{ $labels.instance }}) ne repond plus depuis 1 minute : machine eteinte, service arrete ou pare-feu."

  - name: stockage
    rules:
      - alert: DisqueLinuxPresquePlein
        expr: >-
          100 * (1 - node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs"}
                   / node_filesystem_size_bytes{fstype=~"ext4|xfs|btrfs"}) > 85
        for: 2m
        labels:
          severite: avertissement
        annotations:
          resume: "{{ $labels.hote }} : {{ $labels.mountpoint }} a {{ $value | printf \"%.1f\" }} %"
          description: "Le systeme de fichiers {{ $labels.mountpoint }} de {{ $labels.hote }} depasse 85 % d'occupation."

      - alert: DisqueWindowsPresquePlein
        expr: >-
          100 * (1 - windows_logical_disk_free_bytes{volume="C:"}
                   / windows_logical_disk_size_bytes{volume="C:"}) > 85
        for: 2m
        labels:
          severite: avertissement
        annotations:
          resume: "{{ $labels.hote }} : C: a {{ $value | printf \"%.1f\" }} %"
          description: "Le disque C: de {{ $labels.hote }} depasse 85 % d'occupation."

  - name: ressources
    rules:
      - alert: CPULinuxEleve
        expr: 100 * (1 - avg by (hote) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 90
        for: 5m
        labels:
          severite: avertissement
        annotations:
          resume: "{{ $labels.hote }} : CPU a {{ $value | printf \"%.0f\" }} %"

      - alert: CPUWindowsEleve
        expr: 100 * (1 - avg by (hote) (rate(windows_cpu_time_total{mode="idle"}[5m]))) > 90
        for: 5m
        labels:
          severite: avertissement
        annotations:
          resume: "{{ $labels.hote }} : CPU a {{ $value | printf \"%.0f\" }} %"

      - alert: MemoireLinuxElevee
        expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
        for: 5m
        labels:
          severite: avertissement
        annotations:
          resume: "{{ $labels.hote }} : memoire a {{ $value | printf \"%.0f\" }} %"

  - name: services
    rules:
      - alert: ServiceLinuxArrete
        expr: node_systemd_unit_state{name="nginx.service", state="active"} == 0
        for: 1m
        labels:
          severite: critique
        annotations:
          resume: "{{ $labels.hote }} : {{ $labels.name }} arrete"
          description: "Le service {{ $labels.name }} n'est plus actif sur {{ $labels.hote }}. Verifier : systemctl status nginx, journalctl -u nginx."

      - alert: ServiceWindowsArrete
        expr: windows_service_state{name=~"(?i)(ntds|dns|netlogon|kdc)", state="running"} == 0
        for: 1m
        labels:
          severite: critique
        annotations:
          resume: "{{ $labels.hote }} : service {{ $labels.name }} arrete"
          description: "Service Active Directory ou DNS arrete sur {{ $labels.hote }}. Verifier : Get-Service, observateur d'evenements."
