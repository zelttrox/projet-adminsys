[windows]
win-dc01 ansible_host=win-dc01.infraready.test

[linux]
linux01 ansible_host=linux01.infraready.test

[ops]
ops01 ansible_connection=local

[windows:vars]
ansible_user=WIN-DC01@infraready.test
ansible_connection=winrm
ansible_port=5986
ansible_winrm_transport=ntlm
ansible_winrm_server_cert_validation=ignore

[linux:vars]
ansible_user=adminlinux
ansible_become_exe=sudo.ws
ansible_python_interpreter=/usr/bin/python3

[ops:vars]
ansible_become_exe=sudo.ws
ansible_python_interpreter=/usr/bin/python3
